<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cửa hàng</title>
<link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css"><link rel="stylesheet" href="/vendor/icons/bootstrap-icons.min.css"><link rel="stylesheet" href="/css/style.css"></head>
<body><main class="container py-3">
<div id="info" class="mb-3"></div>
<div class="row g-3">
  <section class="col-lg-8">
    <div id="chips" class="cat-chips"></div>
    <div id="menu"></div>
  </section>
  <aside class="col-lg-4">
    <div class="offcanvas-lg offcanvas-end" tabindex="-1" id="cartPanel" style="--bs-offcanvas-width: min(92vw, 380px)">
      <div class="offcanvas-header d-lg-none">
        <h5 class="offcanvas-title">🛒 Giỏ hàng</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#cartPanel" aria-label="Đóng"></button>
      </div>
      <div class="offcanvas-body p-3 p-lg-0 d-block">
        <div class="card card-body sticky-lg-top cart-card" id="cart"></div>
      </div>
    </div>
  </aside>
</div>
</main>
<button id="cartBar" class="btn btn-success btn-lg cart-bar d-lg-none d-none justify-content-between align-items-center" data-bs-toggle="offcanvas" data-bs-target="#cartPanel"></button>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/common.js"></script>
<script src="/js/shop.js"></script></body></html>
